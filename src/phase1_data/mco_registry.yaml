#   so his separate multi-club network does not flag Palace. Palace is already
#   flagged via Textor (~40%) from 2021-22.
# - Kroenke / Arsenal (Colorado Rapids): MLS single-entity franchise, no
#   football synergy channel; excluded under the men's-pro-football reading —
#   noted as a definitional sensitivity.
# - FSG/Liverpool, Glazers/Man Utd (pre-INEOS), Fosun/Wolves, 49ers/Leeds,
