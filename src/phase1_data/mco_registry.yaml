    scope: integrated
    members:
      - {club: Chelsea, league: premier-league, from_season: "2022-2023", to_season: null,
         note: "BlueCo (Boehly/Clearlake) completed Chelsea takeover May 2022 (GBP 4.25bn incl. commitments)",
         source: "https://en.wikipedia.org/wiki/BlueCo", verified: true}
