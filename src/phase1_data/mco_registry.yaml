# Multi-club ownership (MCO) registry — core input for H2.
#
# Definition (methodology section):
#   A club-season is MCO if, during that season, a shareholder/group holding a
#   controlling or significant (>=25%) stake in the club simultaneously held a
#   controlling/significant stake in at least one other men's professional
#   football club. A stake completed mid-season counts from that season.
#
# `scope`: integrated (shared scouting/pathways — the H2 synergy story) vs
# portfolio (financial holding, weak/no sporting integration) — enables
# sensitivity tests.
#
# All entries verified against the cited sources on 2026-07-14.

groups:
